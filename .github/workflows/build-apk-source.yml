  sign-arm64:
    needs: verify-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pocket-harness-arm64-verified-${{ github.sha }}
          path: .
      - name: Sign final ARM64 source APK in an isolated job
        env:
          POCKET_SIGNING_KEYSTORE_BASE64: ${{ secrets.POCKET_SIGNING_KEYSTORE_BASE64 }}
          POCKET_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.POCKET_SIGNING_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          export APKSIGNER="$signer"
          node scripts/source-build/sign-source-artifacts.mjs
