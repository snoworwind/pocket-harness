      - name: Build runtime snapshot from verified inputs
        shell: bash
        run: |
          set -euo pipefail
          original=".deploy-tmp/source-build/preinstall.original.json"
          test -f "$original"
          restore_config() { cp "$original" scripts/snapshot-config/preinstall.json; }
          server_pid=""
          cleanup() {
            restore_config
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          node -e 'const fs=require("fs"); const p="scripts/snapshot-config/preinstall.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); x.mirrors=["http://127.0.0.1:8787"]; fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
          python3 -m http.server 8787 --bind 127.0.0.1 \
            --directory .deploy-tmp/source-build/termux-webroot \
            > .deploy-tmp/source-build/termux-http.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/dists/stable/main/binary-aarch64/Packages.gz >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8787/dists/stable/main/binary-aarch64/Packages.gz >/dev/null
          if node scripts/build-snapshot-013.mjs arm64; then
            :
          else
            node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const esbuild = require('./plugins/dsh-android-bridge/node_modules/esbuild')
          const root = '.deploy-tmp/snapshot-013/arm64/stage/root'
          let failures = 0
          function walk(dir, rel = '') {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const childRel = rel ? `${rel}/${entry.name}` : entry.name
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full, childRel)
              else if (entry.isFile() && (/(^|\/)dsh-web-frontend\/dist\/.*\.js$/.test(childRel) || /(^|\/)lib\/client\.js$/.test(childRel))) {
                try { esbuild.transformSync(fs.readFileSync(full, 'utf8'), { loader: 'js', logLevel: 'silent', target: 'chrome87' }) }
                catch (error) {
                  failures++
                  console.error(`CHROME87 transform failed: ${childRel}`)
                  for (const item of error.errors ?? []) console.error(item.text)
                }
              }
            }
          }
          if (fs.existsSync(root)) walk(root)
          if (!failures) console.error('CHROME87 diagnostic found no failing file in the retained stage tree')
          NODE
            exit 1
          fi
          # Build-time fixture capture only: exact cached source/raw overlay files, including PI/PTC companions.
          # The full pre-omission overlay is required; never relabel old fixtures or guess output chunk/hash.
          node scripts/probe-engine-anchors.mjs --fixtures --capture-only \
            --overlay .deploy-tmp/source-build/engine-overlay.original.json \
            --source-manifest .deploy-tmp/engine-overlay/source-build-manifest.json
          # 引擎补丁的副本收敛：pnpm 布局下同一包在上层与 `.pnpm/**` store 各有一份物理文件，
          # 而引擎树补丁只按登记表的顶层 target 写入 ⇒ store 副本保持原样；运行时按依赖查找
          # 可能解析到 store 那份（设备实锤：node-addon-require-builtin 未打补丁 ⇒ 引擎 boot 硬崩；
          # 同批 pi-toolcall-G2 亦然）。这里把已打补丁那份的字节写全，随后由快照检查器断言
          # 「任何副本都不得缺 marker」，两道一起保证这类差异不再出厂。
          node scripts/source-build/reconcile-engine-patch-copies.mjs \
            .deploy-tmp/snapshot-013/arm64/stage/root/usr/lib/node_modules/@deepseek-ai/dsh \
            .deploy-tmp/source-build/engine-patch-copy-reconciliation.json
          node scripts/source-build/materialize-dsh-pnpm-packages.mjs \
            .deploy-tmp/snapshot-013/arm64/stage/root/usr/lib/node_modules/@deepseek-ai/dsh \
            .deploy-tmp/engine-overlay/source-build-manifest.json \
            .deploy-tmp/source-build/pnpm-package-materialization.json
          node scripts/source-build/prepare-linux-snapshot-bundle.mjs --self-test \
            .deploy-tmp/linux-build/assets .deploy-tmp/linux-build/provenance
          node scripts/source-build/prepare-linux-snapshot-bundle.mjs \
            .deploy-tmp/linux-build/assets .deploy-tmp/linux-build/provenance \
            .deploy-tmp/snapshot-013/arm64/stage/root
          snapshot_archive="$GITHUB_WORKSPACE/.deploy-tmp/snapshot-013/arm64/snapshot.tar.xz"
          snapshot_repacked="$GITHUB_WORKSPACE/.deploy-tmp/snapshot-013/arm64/snapshot.source-built.tar.xz"
          (
            cd .deploy-tmp/snapshot-013/arm64/stage/root
            tar -c --mtime=@1704067200 usr home/.dsh home/.gitconfig 2>/dev/null \
              | xz -T8 -6 > "$snapshot_repacked"
          )
          mv "$snapshot_repacked" "$snapshot_archive"
          sha256sum "$snapshot_archive" | cut -d' ' -f1 > .deploy-tmp/snapshot-013/arm64/snapshot.sha256
          node scripts/source-build/check-dsh-runtime-dependencies.mjs \
            .deploy-tmp/snapshot-013/arm64/stage/root/usr/lib/node_modules/@deepseek-ai/dsh \
            .deploy-tmp/source-build/post-snapshot-runtime-dependency-check.json
          node scripts/source-build/check-android-native-runtime-packages.mjs \
            .deploy-tmp/snapshot-013/arm64/stage/root/usr/lib/node_modules/@deepseek-ai/dsh \
            .deploy-tmp/source-build/post-snapshot-native-runtime-check.json
          # The standard runner has 14 GB of disk. Before the snapshot checker and
          # APK gate extract another copy of the engine, reclaim source-only trees
          # that are no longer inputs. Run 39113529859 reached 83 MB free and both
          # replicas failed with ENOSPC; the staged snapshot, engine-overlay cache,
          # source-build reports, and Linux provenance are deliberately retained.
          node scripts/source-build/reclaim-build-disk.mjs --root "$GITHUB_WORKSPACE"
          node scripts/source-build/check-dsh-source-snapshot.mjs "$snapshot_archive"

      - name: 单元测试门禁前置（:app:testDebugUnitTest 全量）
        shell: bash
        run: |
          set -e
          # 为什么必须在这里跑：APK 步调用的 scripts/build-apk.mjs 会执行聚合门禁集，其中之一是
          # check-kotlin-test-count.mjs，它**按设计**在没有 gradle 结果时判红——拒绝「一个用例都没跑」
          # 冒充通过（上游 0.14.2-fx-2 的 G.0 ⑤ 正是这条结构性脱节：CI 只跑 compileDebugKotlin、
          # 从不跑 Kotlin 单测也从不调该计数门禁，于是「测试类被删」时 CI 仍绿）。
          # 修法随上游合并而来时去掉了 --allow-missing，故**调用方必须先产出结果**；本地链与
          # 原发布链（release.yml，已于 2026-10-15 按用户决定退役）都已在 APK 步之前跑本步，
          # 来源链此前漏了它，实测必死在该门禁上。本分支现在只有来源链，故本步是唯一入口。
          # 结果目录 app/build/test-results/testDebugUnitTest 会被后续门禁就地读取并比对基线。
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          overlay_gate_backup=.deploy-tmp/source-build/check-engine-overlay.original.mjs
          cp scripts/check-engine-overlay.mjs "$overlay_gate_backup"
          restore_overlay() {
            cp .deploy-tmp/source-build/engine-overlay.original.json scripts/snapshot-config/engine-overlay.json
            cp "$overlay_gate_backup" scripts/check-engine-overlay.mjs
          }
          trap restore_overlay EXIT
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const policyPath = '.deploy-tmp/source-build/source-build-policy.json'
          const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'))
          const digest = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')
          policy.sourceBuiltEngineOverlayGate = {
            originalGate: 'scripts/check-engine-overlay.mjs',
            originalGateSha256: digest('.deploy-tmp/source-build/check-engine-overlay.original.mjs'),
            temporaryAdapter: 'scripts/source-build/check-dsh-source-snapshot-gate.mjs',
            temporaryAdapterSha256: digest('scripts/source-build/check-dsh-source-snapshot-gate.mjs'),
            checker: 'scripts/source-build/check-dsh-source-snapshot.mjs',
            checkerSha256: digest('scripts/source-build/check-dsh-source-snapshot.mjs'),
            reason: 'The standard gate models the older flattened npm overlay; this source audit uses the pinned 0.2.1-rc.3 pnpm deploy tree. The replacement validates the final snapshot against the pinned source package manifest, pnpm dependency links, and registered engine patch markers.'
          }
          fs.writeFileSync(policyPath, JSON.stringify(policy, null, 2) + '\n')
          NODE
          node scripts/source-build/restore-overlay-pins.mjs \
            scripts/snapshot-config/engine-overlay.json \
            .deploy-tmp/source-build/source-build-policy.json
          cp scripts/source-build/check-dsh-source-snapshot-gate.mjs scripts/check-engine-overlay.mjs
          node scripts/build-apk.mjs --abi arm64 --suffix -source
          echo "构建步骤退出，记录产物来源；上传前统一验证三签与证书"
          find out -type f -name '*.apk' -print -exec sha256sum {} \; > .deploy-tmp/source-build/apk-sha256.txt
          echo "apk-sha256.txt 行数: $(wc -l < .deploy-tmp/source-build/apk-sha256.txt)"
          if [ ! -s .deploy-tmp/source-build/apk-sha256.txt ]; then
            echo "::error::未产出 APK 清单（.deploy-tmp/source-build/apk-sha256.txt 为空）"
            exit 1
          fi
          find .deploy-tmp/engine-overlay -maxdepth 1 -type f -name '*.tgz' -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > .deploy-tmp/source-build/engine-overlay-sha256.txt
          find .deploy-tmp/snapshot-013/arm64/.debs -maxdepth 1 -type f -name '*.tgz' -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > .deploy-tmp/source-build/runtime-tarballs-sha256.txt
          for d in plugins/dsh-android-bridge plugins/dsh-android-manage plugins/dsh-android-linux-env plugins/dsh-android-file-open plugins/dsh-model-capability plugins/dsh-android-browser plugins/dsh-android-vdisplay dsh-shell-termux dsh-client-ui-responsive vendor/dshmarketplace-plugin; do
            sha256sum "$d/package.json" "$d/package-lock.json" 2>/dev/null || true
          done > .deploy-tmp/source-build/plugin-lock-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > .deploy-tmp/source-build/project-source-commit.txt
          node scripts/source-build/record-project-components.mjs outputs \
            .deploy-tmp/source-build/project-component-provenance.json
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const project = JSON.parse(fs.readFileSync('.deploy-tmp/source-build/project-component-provenance.json', 'utf8'))
          const harness = JSON.parse(fs.readFileSync('.deploy-tmp/source-build/harness-vendor-lock-reconciliation.json', 'utf8'))
          const expectedHarnessCommit = JSON.parse(fs.readFileSync('scripts/contract.json', 'utf8')).upstream.commit
          if (harness.harnessSourceCommit !== expectedHarnessCommit) {
            throw new Error('Harness source provenance does not match the pinned upstream commit')
          }
          const out = { projectCommit: project.projectCommit, deepseekHarnessCommit: harness.harnessSourceCommit, components: project.components }
          out.components['dshmarketplace-plugin'] = {
            source: 'pinned npm publish artifact',
            tarball: 'https://registry.npmjs.org/dshmarketplace-plugin/-/dshmarketplace-plugin-0.1.7.tgz',
            tarballSha256: crypto.createHash('sha256').update(fs.readFileSync('.deploy-tmp/component-sources/dshmarketplace-plugin-0.1.7.tgz')).digest('hex'),
          }
          out.components['dsh-undo-savepoint'] = {
            source: 'checked-in JavaScript source',
            fileSha256: crypto.createHash('sha256').update(fs.readFileSync('vendor/dsh-undo-savepoint/lib/index.js')).digest('hex'),
          }
          fs.writeFileSync('.deploy-tmp/source-build/component-source-provenance.json', JSON.stringify(out, null, 2) + '\n')
          NODE
          sha256sum app/build.gradle.kts build.gradle.kts settings.gradle.kts \
            > .deploy-tmp/source-build/android-build-inputs-sha256.txt
          gradle_artifacts="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          find "$gradle_artifacts" -type f \( -name '*.jar' -o -name '*.aar' \) -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > .deploy-tmp/source-build/gradle-artifacts-sha256.txt
          cat .deploy-tmp/source-build/apk-sha256.txt

      - name: Snapshot semantic normalization digest
        shell: bash
        run: |
          set -euo pipefail
          # 语义归一化摘要（坑 210）——**必须从产出的 APK 取快照**。
          # 检查器（check-dsh-source-snapshot.mjs）看到的是注入**前**的快照，而 APK 装的是
          # 注入**后**的（build-apk.mjs 的 snapIn，经 inject-all.py 生成）；两者条目数都不同
          # （实测 42443 vs 42839）。把注入前那份的摘要公布出去，等于给外部复核方一个他们
          # 复算不出来的值——而「可被外部独立复核」正是这条链的核心主张。这是坑 183
          # （「发布链的快照输入必须是注入后产物」）的同型复发：**只有这一处跑在注入前**，
          # 其余门禁（build-apk.mjs:304-320）全在 snapIn 上跑。
          # 本步与复核方**做同一件事**：拿 APK → 取 assets/snapshot.tar.xz → 归一化 → 比摘要。
          #
          # 取**本轮刚产出**的那个 APK，不能取「字典序第一」。本地 out/ 会累积历次版本的产物
          # （实测：v0.14.2-fx-2 排在 v0.14.3 之前），`find|sort|head -1` 于是挑中最旧那个 ⇒
          # 公布的摘要描述的是**上一轮**的树，复核方拿本轮发货 APK 复算必然对不上——正是上面这段
          # 「给外部一个他们复算不出来的值」所警告的情形，只是换了个触发方式（坑 227）。
          # CI 每轮全新工作区、out/ 只有一个，故从不暴露；与坑 215-218 同族：工作区干净是 CI 的
          # 隐含前提，不是链的语义。按 mtime 取最新（CI 侧无操作），并把选中的产物打出来留痕。
          apk=$(find out -type f -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          test -n "$apk"
          echo "normalization source APK: $apk"
          work=.deploy-tmp/source-build/normalization
          rm -rf "$work"
          mkdir -p "$work/tree"
          unzip -p "$apk" assets/snapshot.tar.xz > "$work/snapshot.tar.xz"
          tar -xJf "$work/snapshot.tar.xz" -C "$work/tree"
          node scripts/source-build/normalize-snapshot.mjs "$work/tree" \
            --out .deploy-tmp/source-build/snapshot-normalization.json
          rm -rf "$work"

      - name: Reverify final APK files before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-apk-signatures.mjs --self-test
          mapfile -t apks < <(find out -type f -name '*.apk' | sort)
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::source build has no final APKs"; exit 1; }
          args=()
          for apk in "${apks[@]}"; do args+=(--apk "$apk"); done
          node scripts/check-apk-signatures.mjs "${args[@]}" --apksigner "$(cat .deploy-tmp/source-build/apksigner-path.txt)" --certificate-sha256 "$POCKET_BUILD_CERTIFICATE_FILE"
