name: build-apk-source

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  termux-package-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require the maintained source branch
        env:
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          test "$SOURCE_REF" = refs/heads/main

      - name: Checkout project source without Git LFS runtime archives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'

      - name: Install Termux signature verification tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg

      - name: Authenticate the pinned Termux bootstrap and prepare this run's package snapshot
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_root=.deploy-tmp/termux-package-bootstrap
          artifact_root=.deploy-tmp/termux-package-artifact
          mkdir -p "$bootstrap_root" "$artifact_root"
          python3 - <<'PY' > "$bootstrap_root/bootstrap-pins.env"
          import ast
          from pathlib import Path
          tree = ast.parse(Path('scripts/source-build/prepare-termux-bootstrap.py').read_text())
          values = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id in {'BOOTSTRAP_URL', 'BOOTSTRAP_SHA256'}:
                      values[node.targets[0].id] = ast.literal_eval(node.value)
          if set(values) != {'BOOTSTRAP_URL', 'BOOTSTRAP_SHA256'}:
              raise SystemExit('Termux bootstrap URL/hash pins are incomplete')
          print('BOOTSTRAP_URL=' + values['BOOTSTRAP_URL'])
          print('BOOTSTRAP_SHA256=' + values['BOOTSTRAP_SHA256'])
          PY
          source "$bootstrap_root/bootstrap-pins.env"
          curl --fail --location --retry 3 "$BOOTSTRAP_URL" -o "$bootstrap_root/bootstrap-aarch64.zip"
          printf '%s  %s\n' "$BOOTSTRAP_SHA256" "$bootstrap_root/bootstrap-aarch64.zip" | sha256sum --check --strict
          python3 scripts/source-build/prepare-termux-bootstrap.py --extract-bootstrap-only \
            "$bootstrap_root/bootstrap-aarch64.zip" "$bootstrap_root/bootstrap-extracted/usr"
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('scripts/snapshot-config/preinstall.json').read_text(encoding='utf-8'))
          if 'nodejs-lts' not in source['targets']:
              source['targets'].append('nodejs-lts')
          source['requiredTargets'] = ['nodejs-lts']
          target = Path('.deploy-tmp/termux-package-bootstrap/preinstall.json')
          target.write_text(json.dumps(source, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/source-build/prepare-termux-signed-repo.py \
            "$bootstrap_root/bootstrap-extracted/usr" \
            "$artifact_root/termux-webroot" \
            "$bootstrap_root/preinstall.json"

          # Debian epoch versions put ':' in valid package filenames, but the
          # Actions artifact service rejects that character in archived paths.
          # Keep the authenticated repository byte-for-byte inside one tar file.
          COPYFILE_DISABLE=1 tar --create --file=.deploy-tmp/termux-package-inputs.tar \
            --directory="$artifact_root" termux-webroot termux-packages-provenance.json

      - name: Upload the authenticated Termux package snapshot for this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termux-package-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy-tmp/termux-package-inputs.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-arm64:
    needs: termux-package-inputs
    strategy:
      fail-fast: false
      matrix:
        replica: [primary, reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DSH_APK_DIR: ${{ github.workspace }}
    steps:
      - name: Require the maintained source branch
        env:
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          test "$SOURCE_REF" = refs/heads/main

      - name: Checkout project source without Git LFS runtime archives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Prepare build tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - name: Isolate npm cache from checked-in developer settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-npm-cache"
          echo "npm_config_cache=$RUNNER_TEMP/dsh-npm-cache" >> "$GITHUB_ENV"
          npm install -g corepack@0.36.0 --ignore-scripts --no-audit --no-fund
      - name: Verify pinned source replacement before the expensive build
        run: |
          python3 -m unittest discover -s scripts/source-build -p 'test_*.py' -v
          node --test scripts/source-build/*.test.mjs scripts/check-apk-signatures.test.mjs scripts/resolve-version-suffix.test.mjs scripts/tests/main-frame-bridge.test.mjs scripts/tests/engine-private-transport.test.mjs
          node scripts/source-build/check-linux-native-libraries.mjs --self-test
          python3 scripts/source-build/verify-linux-native-apk.py --self-test
          node --test vendor/dsh-linux-runtime/test/manager.test.mjs
          node scripts/source-build/restore-effective-engine-overlay.mjs --self-test
          node scripts/source-build/restore-effective-engine-overlay.mjs --self-test-negative
          node scripts/source-build/reclaim-build-disk.mjs --self-test
          node scripts/source-build/check-package-lock-roots.mjs
          node scripts/source-build/check-workflow-action-pins.mjs --self-test
      - name: Install archive and signature tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xz-utils gnupg unzip zstd g++

      # 产出侧签名断言要用 apksigner，而它属于 Android SDK 的 build-tools——
      # runner 镜像上是否预装并不稳定（本仓 pr-gate / release 两条链都显式
      # `sdkmanager "build-tools;36.0.0"`），故在这里**提前**解析：拿不到就当场判红，
      # 不让它拖到出包之后才失败。解析结果落盘供打包步骤复用。
      - name: Resolve the Android SDK apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/source-build
          sdk_roots=()
          if [ -n "${ANDROID_HOME:-}" ]; then sdk_roots+=("$ANDROID_HOME"); fi
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then sdk_roots+=("$ANDROID_SDK_ROOT"); fi
          sdk_roots+=("/usr/local/lib/android/sdk" "$HOME/Android/Sdk")
          resolve_apksigner() {
            local root candidate
            for root in "${sdk_roots[@]}"; do
              [ -d "$root/build-tools" ] || continue
              candidate=$(find "$root/build-tools" -maxdepth 2 -type f -name apksigner | sort | tail -1 || true)
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          apksigner_bin="$(resolve_apksigner || true)"
          if [ -z "$apksigner_bin" ]; then
            echo "apksigner 不在场，尝试用 sdkmanager 装 build-tools（与 pr-gate / release 同一做法）"
            for root in "${sdk_roots[@]}"; do
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | sudo "$root/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null 2>&1 || true
                break
              fi
            done
            apksigner_bin="$(resolve_apksigner || true)"
          fi
          if [ -z "$apksigner_bin" ]; then
            echo "::error::找不到 apksigner；ANDROID_HOME='${ANDROID_HOME:-<unset>}' ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-<unset>}'"
            for root in "${sdk_roots[@]}"; do
              echo "--- 列目录: $root"
              ls -la "$root" 2>&1 | sed -n '1,20p'
            done
            exit 1
          fi
          printf '%s\n' "$apksigner_bin" > .deploy-tmp/source-build/apksigner-path.txt
          echo "apksigner: $apksigner_bin"
          "$apksigner_bin" version
          # Builders never receive the production key. Each replica signs with a throwaway key.
          signing_dir="$RUNNER_TEMP/pocket-build-signing"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          build_password=$(openssl rand -hex 24)
          echo "::add-mask::$build_password"
          rm -f "$signing_dir/build.p12"
          keytool -genkeypair -alias pocketharness -keystore "$signing_dir/build.p12" -storetype PKCS12 \
            -storepass "$build_password" -keypass "$build_password" -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Pocket Harness build replica' -noprompt
          keytool -exportcert -alias pocketharness -keystore "$signing_dir/build.p12" -storepass "$build_password" \
            | sha256sum | cut -d' ' -f1 > .deploy-tmp/source-build/build-signing-certificate-sha256.txt
          export POCKET_SIGNING_KEYSTORE_PATH="$signing_dir/build.p12"
          export POCKET_SIGNING_KEYSTORE_PASSWORD="$build_password"
          export POCKET_BUILD_CERTIFICATE_FILE="$GITHUB_WORKSPACE/.deploy-tmp/source-build/build-signing-certificate-sha256.txt"
          echo "POCKET_SIGNING_KEYSTORE_PATH=$POCKET_SIGNING_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "POCKET_SIGNING_KEYSTORE_PASSWORD=$build_password" >> "$GITHUB_ENV"
          echo "POCKET_BUILD_CERTIFICATE_FILE=$POCKET_BUILD_CERTIFICATE_FILE" >> "$GITHUB_ENV"
          expected_signing_certificate=$(cat "$POCKET_BUILD_CERTIFICATE_FILE")
          mkdir -p .deploy-tmp/source-build/signing-self-test
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('.deploy-tmp/source-build/signing-self-test/probe.zip', 'w') as archive:
              archive.writestr('AndroidManifest.xml', '<manifest/>')
          PY
          self_test_apk=.deploy-tmp/source-build/signing-self-test/probe.apk
          "$apksigner_bin" sign --min-sdk-version 26 \
            --ks "$signing_dir/build.p12" --ks-type PKCS12 \
            --ks-pass "pass:$POCKET_SIGNING_KEYSTORE_PASSWORD" \
            --ks-key-alias pocketharness --out "$self_test_apk" \
            .deploy-tmp/source-build/signing-self-test/probe.zip
          # 探针包的 manifest 是纯文本，apksigner 无法自行判定 minSdk，必须显式给（真实 APK 不需要）。
          probe_output=$("$apksigner_bin" verify --print-certs --verbose --min-sdk-version 26 "$self_test_apk" 2>&1 || true)
          probe_normalized=$(printf '%s' "$probe_output" | tr 'A-F' 'a-f' | tr -d ':')
          if ! printf '%s' "$probe_normalized" | grep -q "$expected_signing_certificate"; then
            echo "::error::签名自证失败：来源签名与固定证书指纹不匹配"
            echo "--- apksigner sign/verify 原始输出开始 ---"
            printf '%s\n' "$probe_output"
            echo "--- apksigner 原始输出结束 ---"
            exit 1
          fi
          echo "签名自证通过：keystore 可签名，且 apksigner 能读出期望指纹"

      # Only meaningful when a trusted base is committed. Without base-lock.json there is
      # nothing to restore, and resolving a key would fail the build on unrelated toolchain
      # drift; skip it so the source chain keeps building from source.
      - name: Resolve engine base key and lock
        id: engine-base
        if: hashFiles('base-lock.json') != ''
        shell: bash
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            node scripts/source-build/engine-base.mjs plan .deploy-tmp/engine-base-plan.json
          else
            echo "local source chain: base cache disabled; engine will build from source"
          fi

      - name: Restore trusted engine base
        id: engine-cache
        if: steps.engine-base.outputs.trusted == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deploy-tmp/base-cache
          key: ${{ steps.engine-base.outputs.cache_key }}

      - name: Materialize trusted engine base
        if: steps.engine-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
            echo "local source chain: no locked base to materialize"
            exit 0
          fi
          node scripts/source-build/engine-base.mjs materialize .deploy-tmp/base-cache

      - name: Freeze current project component inputs for trusted cache hit
        if: steps.engine-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/source-build
          node scripts/source-build/record-project-components.mjs inputs \
            .deploy-tmp/source-build/project-component-provenance.json

      - name: Fail closed when a trusted engine base is unavailable
        if: steps.engine-base.outputs.trusted == 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
            exit 0
          fi
          echo "::error::trusted engine base is locked but absent; run build-base.yml for this key"
          exit 1

      - name: Build and pack DeepSeek Harness from source
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/source-build/build-engine.sh

      - name: Authenticate official Termux bootstrap and extract signing keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/source-build
          # Reuse only an authenticated cache hit; an interrupted curl may leave a partial ZIP.
          # Read the canonical pin without importing/executing the bootstrap preparer.
          bootstrap_sha256=$(python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("scripts/source-build/prepare-termux-bootstrap.py").read_text())
          pins = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "BOOTSTRAP_SHA256" for target in node.targets)]
          if len(pins) != 1 or len(pins[0]) != 64 or any(c not in "0123456789abcdef" for c in pins[0]):
              raise ValueError("invalid bootstrap SHA-256 pin")
          print(pins[0])
          PY
          )
          if ! printf '%s  %s\n' "$bootstrap_sha256" .deploy-tmp/source-build/bootstrap-aarch64.zip | sha256sum --check --status 2>/dev/null; then
            curl --fail --location --retry 3 \
              'https://github.com/termux/termux-packages/releases/download/bootstrap-2026.09.20-r1%2Bapt.android-7/bootstrap-aarch64.zip' \
              --output .deploy-tmp/source-build/bootstrap-aarch64.zip
          fi
          # 先清空解包目标：本步对**同一目录**重跑不安全——上一轮按 SYMLINKS.txt 建出的符号链接
          # 会让这一轮的 safe_member 解析出界（报 `bootstrap path escaped staging root`）。
          # CI 每轮全新目录所以从不暴露，本地复跑必踩；清掉即幂等。
          rm -rf .deploy-tmp/source-build/bootstrap-extracted
          python3 scripts/source-build/prepare-termux-bootstrap.py \
            --extract-bootstrap-only \
            .deploy-tmp/source-build/bootstrap-aarch64.zip \
            .deploy-tmp/source-build/bootstrap-extracted/usr

      - name: Build project plugins from source
        shell: bash
        run: |
          set -euo pipefail
          # 注意：这里**不含** vendor/dshmarketplace-plugin —— 它是固定 npm 发布产物，tarball 里已带
          # 打好包的 lib/；再跑一次 `npm run build` 会用不同工具链产出不同字节，把我们按发布字节定义的
          # market-* 补丁全部锚空（0.1.5 时代就是这么踩的）。
          mapfile -t plugin_dirs < <(node -e "const fs=require('node:fs'); const {dirs}=require('./scripts/plugin-dirs.json'); console.log(dirs.filter(d=>JSON.parse(fs.readFileSync(d+'/package.json','utf8')).scripts?.build).join('\n'))")
          test "${#plugin_dirs[@]}" -gt 0
          for d in "${plugin_dirs[@]}"; do
            echo "== source build $d =="
            # Declaration roots alone are not a resolved graph. Resolve lock-only first, then npm ci.
            node scripts/source-build/install-project-dependencies.mjs "$d" \
              .deploy-tmp/source-build/plugin-lock-resolution.json
            (cd "$d" && npm run build)
          done

      - name: Apply project patches to the pinned marketplace artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-build/apply-source-marketplace-patches.mjs vendor --apply
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const packageRoot = 'vendor/dshmarketplace-plugin'
          const tarball = '.deploy-tmp/component-sources/dshmarketplace-plugin-0.1.7.tgz'
          const sha256 = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          const patchRegistry = JSON.parse(fs.readFileSync('scripts/patches/registry.json', 'utf8'))
          const marketplacePatches = patchRegistry.patches
            .filter((patch) => patch.target.startsWith('dshmarketplace-plugin/'))
            .map(({ id, target }) => ({ id, target }))
          // 期望集：注册表里必须仍在场的市场补丁。上游退役（market-A / market-C，0.1.7）时必须同步本清单，
          // 否则来源构建在「补丁步骤」判红——那正是本清单存在的意义：补丁集变化必须被人工看一眼。
          const expectedPatches = ['market-B', 'market-D-server', 'market-route-auth-U2', 'market-D-client']
          // 反向断言：已退役的补丁不得悄悄回到注册表（退役记录见 registry.json 的 retired 段）。
          const retiredPatches = ['market-A', 'market-C']
          for (const id of expectedPatches) {
            if (!marketplacePatches.some((patch) => patch.id === id)) throw new Error(`missing registered marketplace patch: ${id}`)
          }
          for (const id of retiredPatches) {
            if (marketplacePatches.some((patch) => patch.id === id)) {
              throw new Error(`retired marketplace patch is registered again: ${id} —— 重启退役补丁须人工复核来源链适配器与本清单`)
            }
          }
          const sourcePackage = JSON.parse(fs.readFileSync(path.join(packageRoot, 'package.json'), 'utf8'))
          const provenance = {
            repository: 'https://github.com/DshMarketPlace/dsh-plugins-store',
            // 输入是**固定 npm 发布产物**（不是组件源码树）：我们的镜像与 market-* 补丁都按发布字节定义。
            publishedTarball: 'https://registry.npmjs.org/dshmarketplace-plugin/-/dshmarketplace-plugin-0.1.7.tgz',
            publishedTarballSha256: sha256(tarball),
            metadataDelta: JSON.parse(fs.readFileSync('.deploy-tmp/source-build/marketplace-metadata-delta.json', 'utf8')),
            adaptedManifestSha256: sha256(path.join(packageRoot, 'package.json')),
            packageVersion: sourcePackage.version,
            inputKind: 'pinned npm publish artifact (trusted binary input, hash-pinned in the workflow)',
            inputReason: 'The vendored mirror and every market-* patch are defined against the published bytes (vendor/dshmarketplace-plugin/PATCHES.md); rebuilding from the component source tree yields different bytes and mis-anchors those patches.',
            projectCommit: process.env.GITHUB_SHA,
            patchRegistrySha256: sha256('scripts/patches/registry.json'),
            patchImplementationSha256: sha256('scripts/patches/apply-patches.mjs'),
            patchMode: 'ensure (--apply)',
            registeredMarketplacePatches: marketplacePatches,
            generatedAndPatchedOutputs: {
              'lib/index.js': sha256(path.join(packageRoot, 'lib/index.js')),
              'lib/client.js': sha256(path.join(packageRoot, 'lib/client.js')),
            },
          }
          fs.writeFileSync('.deploy-tmp/source-build/marketplace-source-provenance.json', JSON.stringify(provenance, null, 2) + '\n')
          NODE

      - name: Add Node.js to the clean Termux base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/source-build
          git show "$GITHUB_SHA:scripts/snapshot-config/preinstall.json" > scripts/snapshot-config/preinstall.json
          cp scripts/snapshot-config/preinstall.json .deploy-tmp/source-build/preinstall.original.json
          test -s .deploy-tmp/source-build/engine-overlay.original.json
          cp .deploy-tmp/source-build/effective-engine-overlay.json \
            .deploy-tmp/source-build/effective-engine-overlay.restore-input.json
          cp .deploy-tmp/source-build/source-build-policy.json \
            .deploy-tmp/source-build/effective-engine-overlay-policy.restore-input.json
          node scripts/source-build/restore-effective-engine-overlay.mjs \
            .deploy-tmp/source-build/engine-overlay.original.json \
            .deploy-tmp/source-build/effective-engine-overlay.restore-input.json \
            .deploy-tmp/source-build/effective-engine-overlay-policy.restore-input.json \
            scripts/snapshot-config/engine-overlay.json \
            .deploy-tmp/source-build/effective-engine-overlay-restoration.json
          node -e 'const fs=require("fs"); const p="scripts/snapshot-config/preinstall.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); if (!x.targets.includes("nodejs-lts")) x.targets.push("nodejs-lts"); x.requiredTargets=["nodejs-lts"]; fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
          node <<'NODE'
          const fs = require('fs')
          const path = 'scripts/snapshot-config/engine-overlay.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          const omitted = manifest.keepUnpublished ?? []
          manifest.keepUnpublished = []
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          const policyPath = '.deploy-tmp/source-build/source-build-policy.json'
          const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'))
          policy.omittedLegacyKeepUnpublished = omitted
          policy.omittedLegacyKeepUnpublishedReason = 'These packages are absent from the pinned Harness source commit and are unmounted legacy residue inherited only from the old LFS runtime base.'
          fs.writeFileSync(policyPath, JSON.stringify(policy, null, 2) + '\n')
          fs.writeFileSync('.deploy-tmp/source-build/effective-engine-overlay.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE

      - name: Download this run's authenticated Termux package snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: termux-package-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy-tmp/source-build/termux-package-artifact

      - name: Safely restore the authenticated Termux package snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('.deploy-tmp/source-build/termux-package-artifact/termux-package-inputs.tar')
          destination = pathlib.Path('.deploy-tmp/source-build').resolve()
          expected_roots = {'termux-webroot', 'termux-packages-provenance.json'}
          seen = set()

          with tarfile.open(archive, mode='r:') as bundle:
              members = bundle.getmembers()
              roots = {pathlib.PurePosixPath(member.name).parts[0]
                       for member in members if pathlib.PurePosixPath(member.name).parts}
              if roots != expected_roots:
                  raise SystemExit(f'unexpected Termux snapshot archive roots: {sorted(roots)}')
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  normalized_name = relative.as_posix()
                  directory_name = member.isdir() and member.name == normalized_name + '/'
                  if (relative.is_absolute() or not relative.parts or '..' in relative.parts
                          or (member.name != normalized_name and not directory_name)):
                      raise SystemExit(f'unsafe Termux snapshot archive path: {member.name!r}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported Termux snapshot archive entry: {member.name!r}')
                  if normalized_name in seen:
                      raise SystemExit(f'duplicate Termux snapshot archive path: {member.name!r}')
                  seen.add(normalized_name)
                  target = destination.joinpath(*relative.parts)
                  if not target.resolve().is_relative_to(destination):
                      raise SystemExit(f'Termux snapshot archive path escapes destination: {member.name!r}')
                  cursor = destination
                  for part in relative.parts[:-1]:
                      cursor = cursor / part
                      if cursor.is_symlink():
                          raise SystemExit(f'Termux snapshot extraction crosses a symlink: {member.name!r}')
                  if target.exists() or target.is_symlink():
                      raise SystemExit(f'Termux snapshot destination already exists: {member.name!r}')
              bundle.extractall(destination, members=members, filter='data')

          archive.unlink()
          archive.parent.rmdir()
          PY

      - name: Cross-compile node-pty Android binding from pinned source
        shell: bash
        run: |
          set -euo pipefail
          ndk_archive=.deploy-tmp/source-build/android-ndk-r30-linux.zip
          ndk_sha1='5107f898313790e449e87eee2183d9a20602dee9'
          # 已存在且钉死的哈希对得上就跳过下载：本地复跑省 704 MB（CI 每轮全新目录，无操作）。
          # 跳过不等于放行——下面那条 sha1sum --check 无论下载与否都照跑。
          if ! printf '%s  %s\n' "$ndk_sha1" "$ndk_archive" | sha1sum --check --status 2>/dev/null; then
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
              --output "$ndk_archive"
          fi
          printf '%s  %s\n' "$ndk_sha1" "$ndk_archive" | sha1sum --check -
          printf '%s\n' '5107f898313790e449e87eee2183d9a20602dee9' \
            > .deploy-tmp/source-build/ndk-archive-sha1.txt
          # 同上：`unzip` 无 -o，目录已在时会走交互式覆盖确认，非交互环境读到 EOF 即判死。
          rm -rf .deploy-tmp/source-build/ndk/android-ndk-r30
          unzip -q "$ndk_archive" -d .deploy-tmp/source-build/ndk
          node_deb=$(python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('.deploy-tmp/source-build/termux-packages-provenance.json').read_text())
          packages = [item for item in report['packages'] if item['package'] == 'nodejs-lts']
          if len(packages) != 1:
              raise SystemExit('signed Termux repository must contain exactly one nodejs-lts package')
          print(pathlib.Path('.deploy-tmp/source-build/termux-webroot') / packages[0]['filename'])
          PY
          )
          mkdir -p .deploy-tmp/source-build/node-deb-extracted
          dpkg-deb --extract "$node_deb" .deploy-tmp/source-build/node-deb-extracted
          node_header=$(find .deploy-tmp/source-build/node-deb-extracted -path '*/include/node/node_api.h' -print -quit)
          test -n "$node_header"
          node_headers=$(dirname "$node_header")
          node scripts/source-build/build-node-pty-android.mjs \
            .deploy-tmp/engine-deploy \
            "$node_headers" \
            .deploy-tmp/source-build/ndk/android-ndk-r30 \
            .deploy-tmp/source-build/node-pty-android-build.json
          node scripts/source-build/check-android-native-runtime-packages.mjs \
            .deploy-tmp/engine-deploy \
            .deploy-tmp/source-build/android-native-runtime-packages.json
          node <<'NODE'
          const fs = require('node:fs')
          const path = '.deploy-tmp/source-build/source-build-policy.json'
          const policy = JSON.parse(fs.readFileSync(path, 'utf8'))
          policy.nodePtyAndroidSourceBuild = {
            report: '.deploy-tmp/source-build/node-pty-android-build.json',
            source: 'node-pty@1.2.0-beta.15 pinned npm package with the Harness lockfile integrity and patch',
            headers: 'nodejs-lts headers from the SHA256-authenticated Termux package in the signed repository',
            toolchain: 'Google Android NDK r30, Linux archive SHA1 5107f898313790e449e87eee2183d9a20602dee9',
          }
          fs.writeFileSync(path, JSON.stringify(policy, null, 2) + '\n')
          NODE

      - name: Assemble clean Termux base with the source-built Android binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/arm64-base
          python3 scripts/source-build/prepare-termux-bootstrap.py \
            .deploy-tmp/source-build/bootstrap-aarch64.zip \
            .deploy-tmp/deepseek-harness \
            .deploy-tmp/engine-deploy \
            .deploy-tmp/arm64-base/base-usr.tar.xz

      - name: Install Linux asset cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu debootstrap debian-archive-keyring qemu-user-static binfmt-support xz-utils
          sudo update-binfmts --enable qemu-aarch64

      - name: Prepare pinned Debian archive trust keys for Linux assets
        shell: bash
        run: |
          set -euo pipefail
          keydir="$GITHUB_WORKSPACE/.deploy-tmp/linux-keyring"
          homedir="$keydir/gnupg"
          mkdir -p "$homedir"
          chmod 700 "$homedir"
          archive_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Sha256')
          archive_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Fingerprint')
          release_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Sha256')
          release_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Fingerprint')
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/archive-key-13.asc -o "$keydir/archive-key-13.asc"
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/release-13.asc -o "$keydir/release-13.asc"
          printf '%s  %s\n%s  %s\n' "$archive_sha" "$keydir/archive-key-13.asc" "$release_sha" "$keydir/release-13.asc" | sha256sum --check --strict
          gpg --batch --quiet --homedir "$homedir" --import /usr/share/keyrings/debian-archive-keyring.gpg "$keydir/archive-key-13.asc" "$keydir/release-13.asc"
          fingerprints=$(gpg --batch --homedir "$homedir" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }')
          grep -Fx "$archive_fingerprint" <<<"$fingerprints"
          grep -Fx "$release_fingerprint" <<<"$fingerprints"
          gpg --batch --quiet --homedir "$homedir" --export > "$keydir/debian-archive-keyring.gpg"
          test -s "$keydir/debian-archive-keyring.gpg"

      - name: Build source-owned offline ARM64 Linux assets
