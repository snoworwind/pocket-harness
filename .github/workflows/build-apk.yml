name: build-apk
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Compare two independent APK builds
        type: boolean
        default: false
      fast:
        description: Faster Linux archive compression
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  source-build:
    uses: ./.github/workflows/build-apk-source.yml
    with:
      abi: all
      reference: ${{ inputs.reference }}
      fast: ${{ inputs.fast }}
