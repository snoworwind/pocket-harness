name: build-base

on:
  workflow_dispatch:
    inputs:
      component: {type: choice, options: [engine], default: engine}
      ref: {type: string, default: main}
      force: {type: boolean, default: false}
      linux_experiment: {type: boolean, default: false}
  workflow_call:
    inputs:
      component: {type: string, default: engine}
      ref: {type: string, default: main}
      force: {type: boolean, default: false}
      linux_experiment: {type: boolean, default: false}

permissions:
  contents: read

concurrency:
  group: base-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      DSH_LINUX_EXPERIMENT: ${{ inputs.linux_experiment && '1' || '0' }}
    outputs:
      key: ${{ steps.plan.outputs.key }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: Require main before checkout or cache access
        env:
          SOURCE_REF: ${{ github.ref }}
          REQUESTED_REF: ${{ inputs.ref }}
          COMPONENT: ${{ inputs.component }}
          LINUX_EXPERIMENT: ${{ inputs.linux_experiment }}
        run: |
          test "$COMPONENT" = engine
          if [ "${LINUX_EXPERIMENT:-false}" = true ]; then
            test "$SOURCE_REF" = refs/heads/codex/linux-runtime-experiment
            case "$REQUESTED_REF" in codex/linux-runtime-experiment|refs/heads/codex/linux-runtime-experiment) ;; *) exit 1;; esac
          else
            test "$SOURCE_REF" = refs/heads/main
            case "$REQUESTED_REF" in main|refs/heads/main) ;; *) exit 1;; esac
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - name: Set up pinned Temurin Java 17 for base resolution (attempt 1)
        id: resolve_java_attempt_1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
        continue-on-error: true
      - name: Retry pinned Temurin Java 17 for base resolution (attempt 2)
        id: resolve_java_attempt_2
        if: steps.resolve_java_attempt_1.outcome == 'failure'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
        continue-on-error: true
      - name: Retry pinned Temurin Java 17 for base resolution (attempt 3)
        id: resolve_java_attempt_3
        if: steps.resolve_java_attempt_2.outcome == 'failure'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
      - name: Prepare fixed package manager and archive tools
        run: |
          npm install -g corepack@0.36.0 --ignore-scripts --no-audit --no-fund --fetch-retries=8 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=300000
          sudo apt-get update
          sudo apt-get install -y zstd g++
      - name: Resolve engine input key
        id: plan
        run: node scripts/source-build/engine-base.mjs plan .deploy-tmp/base-plan.json
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        if: ${{ !inputs.force }}
        with:
          # 稳定内容键：同一 plan.key 的发布产物自动复用，不依赖人工 base-lock。
          path: .deploy-tmp/base-cache
          key: base-engine-${{ steps.plan.outputs.key }}
      - name: Verify a self-describing cache hit
        id: reuse
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          node scripts/source-build/engine-base.mjs reuse-self .deploy-tmp/base-cache .deploy-tmp/base-result .deploy-tmp/base-plan.json
          echo 'reused=true' >> "$GITHUB_OUTPUT"
      - name: Upload resolved plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-base-plan-${{ github.run_id }}
          path: .deploy-tmp/base-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unchanged trusted base
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-engine-${{ steps.plan.outputs.key }}
          path: .deploy-tmp/base-result/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  build:
    needs: resolve
    if: needs.resolve.outputs.reused != 'true' && (github.ref == 'refs/heads/main' || inputs.linux_experiment)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replica: [primary, reference]
    env:
      BASE_REPLICA: ${{ matrix.replica }}
      DSH_LINUX_EXPERIMENT: ${{ inputs.linux_experiment && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - name: Set up pinned Temurin Java 17 for base build (attempt 1)
        id: build_java_attempt_1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
        continue-on-error: true
      - name: Retry pinned Temurin Java 17 for base build (attempt 2)
        id: build_java_attempt_2
        if: steps.build_java_attempt_1.outcome == 'failure'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
        continue-on-error: true
      - name: Retry pinned Temurin Java 17 for base build (attempt 3)
        id: build_java_attempt_3
        if: steps.build_java_attempt_2.outcome == 'failure'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17.0.20+8'}
      - name: Prepare fixed package manager and archive tools
        run: |
          npm install -g corepack@0.36.0 --ignore-scripts --no-audit --no-fund --fetch-retries=8 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=300000
          sudo apt-get update
          sudo apt-get install -y zstd g++
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-base-plan-${{ github.run_id }}
          path: .deploy-tmp/base-plan-input
      - name: Check replica environment and immutable inputs
        run: node scripts/source-build/engine-base.mjs check-plan .deploy-tmp/base-plan-input/base-plan.json
      - name: Restore pnpm store
        id: pnpm-store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ matrix.replica }}-${{ hashFiles('scripts/source-build/engine-toolchain.json') }}
      - name: Build engine using the shared source script
        run: bash scripts/source-build/build-engine.sh
      - name: Save pnpm store
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ matrix.replica }}-${{ hashFiles('scripts/source-build/engine-toolchain.json') }}
      - name: Capture engine payload and file hashes
        run: node scripts/source-build/engine-base.mjs capture .deploy-tmp/base-plan-input/base-plan.json .deploy-tmp/base-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-engine-${{ needs.resolve.outputs.key }}-${{ matrix.replica }}
          path: .deploy-tmp/base-result/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [resolve, build]
    if: needs.resolve.outputs.reused != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-base-plan-${{ github.run_id }}
          path: .deploy-tmp/base-plan-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: base-engine-${{ needs.resolve.outputs.key }}-primary
          path: .deploy-tmp/base-primary
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: base-engine-${{ needs.resolve.outputs.key }}-reference
          path: .deploy-tmp/base-reference
      - name: Compare actual output trees before publication
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          node scripts/source-build/engine-base.mjs compare .deploy-tmp/base-plan-input/base-plan.json .deploy-tmp/base-primary .deploy-tmp/base-reference .deploy-tmp/base-result
      - name: Resolve exact cache transport identity
        id: manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const bytes = readFileSync('.deploy-tmp/base-result/manifest.json')
          const manifest = JSON.parse(bytes)
          appendFileSync(process.env.GITHUB_OUTPUT, `cache_key=base-engine-${manifest.key}-${createHash('sha256').update(bytes).digest('hex')}\n`)
          NODE
          cp -a .deploy-tmp/base-result .deploy-tmp/base-cache
      - name: Cache only the independently verified base
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deploy-tmp/base-cache
          key: ${{ steps.manifest.outputs.cache_key }}
      - name: Cache the independently verified base under its content key
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deploy-tmp/base-cache
          key: base-engine-${{ needs.resolve.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-engine-${{ needs.resolve.outputs.key }}
          path: .deploy-tmp/base-result/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
