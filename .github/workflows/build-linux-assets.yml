name: build-linux-assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/bionilux/**'
      - 'vendor/dsh-linux-runtime/**'
      - 'plugins/dsh-linux-bootstrap/**'
      - 'scripts/source-build/*linux*'
      - 'scripts/source-build/test_prepare_rootfs_dns.py'
      - 'scripts/source-build/test_bionilux_preload_links.py'
      - '.github/workflows/build-linux-assets.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Compile Bionilux preload hooks for Android ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/libbionilux_preload.so" \
            vendor/bionilux/src/preload/hooks.c -pthread -ldl
      - name: Verify source import and controlled tamper rejection
        run: |
          node scripts/source-build/check-linux-sources.mjs --self-test
      - name: Compile and test the reviewed native launcher
        run: |
          rust=$(node -p 'require("./scripts/source-build/linux-inputs.json").rust')
          rustup toolchain install "$rust" --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/linux-host-target" CARGO_PROFILE_DEV_CODEGEN_UNITS=1 rustup run "$rust" cargo test --locked --jobs 8 --manifest-path vendor/bionilux/Cargo.toml
      - name: Runtime manager and manifest regressions
        run: node --test vendor/dsh-linux-runtime/test/*.test.mjs
      - name: Linux asset, preload hook, DNS and license regressions
        run: |
          python3 -m unittest discover -s scripts/source-build -p 'test_*linux*.py' -v
          python3 -m unittest \
            scripts.source-build.test_prepare_rootfs_dns \
            scripts.source-build.test_bionilux_preload_links -v
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Install signed distribution build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu debootstrap debian-archive-keyring qemu-user-static binfmt-support xz-utils
          sudo update-binfmts --enable qemu-aarch64
      - name: Verify official Android NDK before source compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/linux-ndk
          ndk=$(node -p 'require("./scripts/source-build/linux-inputs.json").ndk')
          checksum=$(node -p 'require("./scripts/source-build/linux-inputs.json").ndkSha1')
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/android-ndk-$ndk-linux.zip" -o .deploy-tmp/linux-ndk/ndk.zip
          printf '%s  %s\n' "$checksum" '.deploy-tmp/linux-ndk/ndk.zip' | sha1sum --check --strict
          unzip -q .deploy-tmp/linux-ndk/ndk.zip -d .deploy-tmp/linux-ndk
      - name: Add pinned official Debian 13 archive signing keys
        shell: bash
        run: |
          set -euo pipefail
          keydir="$GITHUB_WORKSPACE/.deploy-tmp/linux-keyring"
          homedir="$keydir/gnupg"
          mkdir -p "$homedir"
          chmod 700 "$homedir"
          archive_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Sha256')
          archive_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Fingerprint')
          release_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Sha256')
          release_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Fingerprint')
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/archive-key-13.asc -o "$keydir/archive-key-13.asc"
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/release-13.asc -o "$keydir/release-13.asc"
          printf '%s  %s\n%s  %s\n' "$archive_sha" "$keydir/archive-key-13.asc" "$release_sha" "$keydir/release-13.asc" | sha256sum --check --strict
          gpg --batch --quiet --homedir "$homedir" --import /usr/share/keyrings/debian-archive-keyring.gpg "$keydir/archive-key-13.asc" "$keydir/release-13.asc"
          fingerprints=$(gpg --batch --homedir "$homedir" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }')
          grep -Fx "$archive_fingerprint" <<<"$fingerprints"
          grep -Fx "$release_fingerprint" <<<"$fingerprints"
          gpg --batch --quiet --homedir "$homedir" --export > "$keydir/debian-archive-keyring.gpg"
          test -s "$keydir/debian-archive-keyring.gpg"
      - name: Build source-owned offline ARM64 Linux assets
        run: |
          ndk=$(node -p 'require("./scripts/source-build/linux-inputs.json").ndk')
          NDK="$GITHUB_WORKSPACE/.deploy-tmp/linux-ndk/android-ndk-$ndk" DEBIAN_KEYRING="$GITHUB_WORKSPACE/.deploy-tmp/linux-keyring/debian-archive-keyring.gpg" bash scripts/source-build/build-linux-assets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocket-harness-linux-arm64-${{ github.sha }}
          path: |
            .deploy-tmp/linux-build/assets/*
            .deploy-tmp/linux-build/provenance/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
