name: build-linux-assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/linux-proot/**'
      - 'vendor/dsh-linux-runtime/**'
      - 'plugins/dsh-android-linux-env/**'
      - 'plugins/dsh-android-bridge/**'
      - 'dsh-shell-termux/**'
      - 'scripts/source-build/*linux*'
      - 'scripts/source-build/*proot*'
      - 'scripts/source-build/proot-source/**'
      - 'scripts/source-build/inventory-native-runtime.py'
      - 'scripts/source-build/test_prepare_rootfs_proot.py'
      - 'scripts/source-build/ensure-no-rootfs-mounts.py'
      - 'scripts/source-build/test_ensure_no_rootfs_mounts.py'
      - 'scripts/source-build/test_proot_compat.py'
      - 'scripts/source-build/test_prepare_proot_backend.py'
      - 'scripts/source-build/linux-assets-workflow.test.mjs'
      - 'scripts/source-build/seed-dsh-profiles.mjs'
      - 'scripts/snapshot-config/preinstall.json'
      - 'scripts/lib/shell.mjs'
      - 'scripts/third-party-licenses.json'
      - 'scripts/check-third-party.mjs'
      - 'scripts/check-third-party.test.mjs'
      - 'LICENSES/**'
      - 'docs/AGENTS/gpl-compliance.md'
      - '.github/workflows/build-apk-source.yml'
      - '.github/workflows/build-linux-assets.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Install native validation toolchain
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "apt attempt ${attempt} failed; retrying"
              sleep 10
            done
            return 1
          }
          retry sudo apt-get update
          retry sudo apt-get install -y gcc gcc-aarch64-linux-gnu dpkg-dev gnupg
      - name: Verify reviewed inputs and native payload shape
        run: |
          node scripts/source-build/check-linux-sources.mjs --self-test
          node --test scripts/source-build/check-linux-sources.test.mjs
          node scripts/source-build/check-linux-native-libraries.mjs --self-test
          python3 scripts/source-build/linux-debian-snapshot-wget.py --self-test
          python3 scripts/source-build/verify-linux-native-apk.py --self-test
      - name: Compile the ARM64 guest compatibility library
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/libpocket-linux-compat.so" \
            vendor/linux-proot/compat/termfold_compat.c -ldl
          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/libpocket-linux-compat.so" | grep 'Machine:.*AArch64'
      - name: Runtime manager and manifest regressions
        run: node --test vendor/dsh-linux-runtime/test/*.test.mjs
      - name: Linux environment plugin build and regression checks
        run: |
          # These file: dependencies publish TypeScript declarations through ignored lib/ outputs.
          # Build them from the checked-in source before compiling linux-env on a clean runner.
          npm ci --prefix dsh-shell-termux --no-audit --no-fund --fetch-retries=8 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=300000
          npm run build --prefix dsh-shell-termux
          npm ci --prefix plugins/dsh-android-bridge --no-audit --no-fund --fetch-retries=8 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=300000
          npm run build --prefix plugins/dsh-android-bridge
          npm ci --prefix plugins/dsh-android-linux-env --no-audit --no-fund --fetch-retries=8 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000 --fetch-timeout=300000
          npm test --prefix plugins/dsh-android-linux-env
      - name: PRoot backend, rootfs and compatibility regressions
        run: |
          python3 scripts/source-build/prepare-proot-source-backend.py --self-test
          python3 -m unittest scripts.source-build.test_prepare_proot_backend scripts.source-build.test_prepare_rootfs_proot scripts.source-build.test_ensure_no_rootfs_mounts scripts.source-build.test_proot_compat scripts.source-build.test_package_linux_assets scripts.source-build.test_linux_debian_snapshot_wget -v
      - name: Third-party notice generator regressions
        run: |
          node --test scripts/check-third-party.test.mjs
          node --test scripts/source-build/linux-assets-workflow.test.mjs
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Install signed distribution build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu debootstrap debian-archive-keyring qemu-user-static binfmt-support gawk xz-utils gnupg unzip make
          sudo update-binfmts --enable qemu-aarch64
      - name: Prepare pinned Android NDK for source-built PRoot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/linux-ndk
          archive=.deploy-tmp/linux-ndk/android-ndk-r30-linux.zip
          sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").ndkSha1')
          bash scripts/source-build/retry-curl.sh --fail --location --retry 8 --retry-max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha1sum --check --strict
          unzip -q "$archive" -d .deploy-tmp/linux-ndk
      - name: Add pinned official Debian 13 archive signing keys
        shell: bash
        run: |
          set -euo pipefail
          keydir="$GITHUB_WORKSPACE/.deploy-tmp/linux-keyring"
          homedir="$keydir/gnupg"
          mkdir -p "$homedir"
          chmod 700 "$homedir"
          archive_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Sha256')
          archive_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Fingerprint')
          release_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Sha256')
          release_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Fingerprint')
          bash scripts/source-build/retry-curl.sh --fail --location --retry 8 --retry-max-time 600 https://ftp-master.debian.org/keys/archive-key-13.asc -o "$keydir/archive-key-13.asc"
          bash scripts/source-build/retry-curl.sh --fail --location --retry 8 --retry-max-time 600 https://ftp-master.debian.org/keys/release-13.asc -o "$keydir/release-13.asc"
          printf '%s  %s\n%s  %s\n' "$archive_sha" "$keydir/archive-key-13.asc" "$release_sha" "$keydir/release-13.asc" | sha256sum --check --strict
          gpg --batch --quiet --homedir "$homedir" --import /usr/share/keyrings/debian-archive-keyring.gpg "$keydir/archive-key-13.asc" "$keydir/release-13.asc"
          fingerprints=$(gpg --batch --homedir "$homedir" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }')
          grep -Fx "$archive_fingerprint" <<<"$fingerprints"
          grep -Fx "$release_fingerprint" <<<"$fingerprints"
          gpg --batch --quiet --homedir "$homedir" --export > "$keydir/debian-archive-keyring.gpg"
          test -s "$keydir/debian-archive-keyring.gpg"
      - name: Build source-owned offline ARM64 Linux assets
        env:
          DEBIAN_KEYRING: ${{ github.workspace }}/.deploy-tmp/linux-keyring/debian-archive-keyring.gpg
          NDK_ROOT: ${{ github.workspace }}/.deploy-tmp/linux-ndk/android-ndk-r30
        run: bash scripts/source-build/build-linux-assets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocket-harness-linux-arm64-${{ github.sha }}
          path: |
            .deploy-tmp/linux-build/assets/*
            .deploy-tmp/linux-build/provenance/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
