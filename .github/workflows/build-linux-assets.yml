name: build-linux-assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/linux-proot/**'
      - 'vendor/dsh-linux-runtime/**'
      - 'plugins/dsh-android-linux-env/**'
      - 'plugins/dsh-linux-bootstrap/**'
      - 'scripts/source-build/*linux*'
      - 'scripts/source-build/prepare-termux-bootstrap.py'
      - 'scripts/source-build/prepare-proot-backend.py'
      - 'scripts/source-build/prepare-termux-signed-repo.py'
      - 'scripts/source-build/test_prepare_termux_bootstrap.py'
      - 'scripts/source-build/test_prepare_termux_signed_repo.py'
      - 'scripts/source-build/test_prepare_rootfs_proot.py'
      - 'scripts/source-build/ensure-no-rootfs-mounts.py'
      - 'scripts/source-build/test_ensure_no_rootfs_mounts.py'
      - 'scripts/source-build/test_proot_compat.py'
      - 'scripts/source-build/test_prepare_proot_backend.py'
      - 'scripts/source-build/linux-assets-workflow.test.mjs'
      - 'scripts/source-build/seed-dsh-profiles.mjs'
      - 'scripts/snapshot-config/preinstall.json'
      - 'scripts/lib/shell.mjs'
      - 'scripts/third-party-licenses.json'
      - 'scripts/check-third-party.mjs'
      - 'scripts/check-third-party.test.mjs'
      - 'scripts/check-vendored-linux-bootstrap.mjs'
      - 'LICENSES/**'
      - 'docs/AGENTS/gpl-compliance.md'
      - '.github/workflows/build-apk-source.yml'
      - '.github/workflows/build-linux-assets.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Install native validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu dpkg-dev gnupg
      - name: Verify reviewed inputs and native payload shape
        run: |
          node scripts/source-build/check-linux-sources.mjs --self-test
          node --test scripts/source-build/check-linux-sources.test.mjs
          node scripts/check-vendored-linux-bootstrap.mjs --self-test
          node scripts/source-build/check-linux-native-libraries.mjs --self-test
          python3 scripts/source-build/verify-linux-native-apk.py --self-test
      - name: Compile the ARM64 guest compatibility library
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/libpocket-linux-compat.so" \
            vendor/linux-proot/compat/termfold_compat.c -ldl
          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/libpocket-linux-compat.so" | grep 'Machine:.*AArch64'
      - name: Runtime manager and manifest regressions
        run: node --test vendor/dsh-linux-runtime/test/*.test.mjs
      - name: Internal Linux plugin build and regression checks
        run: |
          npm ci --prefix plugins/dsh-linux-bootstrap --no-audit --no-fund
          npm run build --prefix plugins/dsh-linux-bootstrap
          node --test plugins/dsh-linux-bootstrap/test/*.test.mjs
          npm ci --prefix plugins/dsh-android-linux-env --no-audit --no-fund
          npm test --prefix plugins/dsh-android-linux-env
      - name: PRoot backend, rootfs and compatibility regressions
        run: |
          python3 -m unittest scripts.source-build.test_prepare_proot_backend scripts.source-build.test_prepare_rootfs_proot scripts.source-build.test_ensure_no_rootfs_mounts scripts.source-build.test_proot_compat scripts.source-build.test_prepare_termux_bootstrap scripts.source-build.test_prepare_termux_signed_repo scripts.source-build.test_package_linux_assets -v
      - name: Third-party notice generator regressions
        run: |
          node --test scripts/check-third-party.test.mjs
          node --test scripts/source-build/linux-assets-workflow.test.mjs
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - name: Install signed distribution build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu debootstrap debian-archive-keyring qemu-user-static binfmt-support xz-utils gnupg
          sudo update-binfmts --enable qemu-aarch64
      - name: Fetch and authenticate the Termux bootstrap signing keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tmp/linux-termux
          python3 - <<'PY' > .deploy-tmp/linux-termux/bootstrap-pins.env
          import ast
          from pathlib import Path
          tree = ast.parse(Path('scripts/source-build/prepare-termux-bootstrap.py').read_text())
          values = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id in {'BOOTSTRAP_URL', 'BOOTSTRAP_SHA256'}:
                      values[node.targets[0].id] = ast.literal_eval(node.value)
          if set(values) != {'BOOTSTRAP_URL', 'BOOTSTRAP_SHA256'}:
              raise SystemExit('Termux bootstrap URL/hash pins are incomplete')
          print('BOOTSTRAP_URL=' + values['BOOTSTRAP_URL'])
          print('BOOTSTRAP_SHA256=' + values['BOOTSTRAP_SHA256'])
          PY
          source .deploy-tmp/linux-termux/bootstrap-pins.env
          curl --fail --location --retry 3 "$BOOTSTRAP_URL" -o .deploy-tmp/linux-termux/bootstrap-aarch64.zip
          printf '%s  %s\n' "$BOOTSTRAP_SHA256" .deploy-tmp/linux-termux/bootstrap-aarch64.zip | sha256sum --check --strict
          python3 scripts/source-build/prepare-termux-bootstrap.py --extract-bootstrap-only \
            .deploy-tmp/linux-termux/bootstrap-aarch64.zip .deploy-tmp/linux-termux/bootstrap-extracted/usr
      - name: Verify signed Termux repository and stage the PRoot package closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source-build/prepare-termux-signed-repo.py \
            .deploy-tmp/linux-termux/bootstrap-extracted/usr \
            .deploy-tmp/linux-termux/webroot \
            scripts/snapshot-config/preinstall.json
      - name: Add pinned official Debian 13 archive signing keys
        shell: bash
        run: |
          set -euo pipefail
          keydir="$GITHUB_WORKSPACE/.deploy-tmp/linux-keyring"
          homedir="$keydir/gnupg"
          mkdir -p "$homedir"
          chmod 700 "$homedir"
          archive_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Sha256')
          archive_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianArchiveKey13Fingerprint')
          release_sha=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Sha256')
          release_fingerprint=$(node -p 'require("./scripts/source-build/linux-inputs.json").debianReleaseKey13Fingerprint')
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/archive-key-13.asc -o "$keydir/archive-key-13.asc"
          curl --fail --location --retry 3 https://ftp-master.debian.org/keys/release-13.asc -o "$keydir/release-13.asc"
          printf '%s  %s\n%s  %s\n' "$archive_sha" "$keydir/archive-key-13.asc" "$release_sha" "$keydir/release-13.asc" | sha256sum --check --strict
          gpg --batch --quiet --homedir "$homedir" --import /usr/share/keyrings/debian-archive-keyring.gpg "$keydir/archive-key-13.asc" "$keydir/release-13.asc"
          fingerprints=$(gpg --batch --homedir "$homedir" --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10 }')
          grep -Fx "$archive_fingerprint" <<<"$fingerprints"
          grep -Fx "$release_fingerprint" <<<"$fingerprints"
          gpg --batch --quiet --homedir "$homedir" --export > "$keydir/debian-archive-keyring.gpg"
          test -s "$keydir/debian-archive-keyring.gpg"
      - name: Build source-owned offline ARM64 Linux assets
        env:
          DEBIAN_KEYRING: ${{ github.workspace }}/.deploy-tmp/linux-keyring/debian-archive-keyring.gpg
          TERMUX_WEBROOT: ${{ github.workspace }}/.deploy-tmp/linux-termux/webroot
          TERMUX_PROVENANCE: ${{ github.workspace }}/.deploy-tmp/linux-termux/termux-packages-provenance.json
          TERMUX_BOOTSTRAP_USR: ${{ github.workspace }}/.deploy-tmp/linux-termux/bootstrap-extracted/usr
        run: bash scripts/source-build/build-linux-assets.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocket-harness-linux-arm64-${{ github.sha }}
          path: |
            .deploy-tmp/linux-build/assets/*
            .deploy-tmp/linux-build/provenance/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
