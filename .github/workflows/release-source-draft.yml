name: release-source-draft

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      POCKET_SIGNING_KEYSTORE_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: source-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require the maintained source branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main

  build:
    needs: branch
    permissions:
      contents: read
    uses: ./.github/workflows/build-apk-source.yml
    secrets: inherit

  prepare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download only this run's source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-mobile-apk-arm64-source-${{ github.sha }}
          path: source-artifact
      - name: Verify identity and package unchanged source artifacts
        run: |
          python3 -m unittest discover -s scripts/source-build -p 'test_prepare_source_release.py' -v
          python3 scripts/source-build/prepare-source-release.py source-artifact release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-draft-assets-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout or build commands in the job holding the release token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-draft-assets-${{ github.sha }}
          path: release-assets
      - name: Create an ARM64 prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          # Validate the complete upload set before checking bytes or invoking gh.
          # sha256sum alone permits omitted files, duplicate rows and external paths.
          python3 - <<'PY'
          import pathlib
          import re
          root = pathlib.Path('.')
          files = list(root.iterdir())
          if any(p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit('release assets must be regular files')
          apks = [p.name for p in files if re.fullmatch(r'dsh-mobile-apk-v[\w.+-]+-source-arm64\.apk', p.name)]
          if len(apks) != 1:
              raise SystemExit('expected exactly one source ARM64 APK')
          expected = {apks[0], 'provenance.zip', 'notes.md'}
          if {p.name for p in files} != expected | {'SHA256SUMS.txt'}:
              raise SystemExit('unexpected or missing release asset')
          rows = (root / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          names = []
          for row in rows:
              match = re.fullmatch(r'[0-9a-f]{64}  ([^/\\]+)', row)
              if not match:
                  raise SystemExit('invalid release checksum row')
              names.append(match[1])
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit('checksums must cover every uploaded asset exactly once')
          PY
          sha256sum --check SHA256SUMS.txt
          tag="hardening-source-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" ./*.apk provenance.zip SHA256SUMS.txt notes.md \
            --target "$SOURCE_SHA" --draft --prerelease \
            --title "Hardening source ARM64 ${SOURCE_SHA:0:12}" \
            --notes-file notes.md
