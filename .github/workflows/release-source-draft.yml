name: release-source-draft
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  reject-experimental-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject release creation from the Linux experiment
        run: |
          echo '::error::Linux runtime experiment builds artifacts only; release and draft publication are disabled.'
          exit 1
