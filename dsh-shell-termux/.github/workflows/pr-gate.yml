# PR Gate — dsh-shell-termux: build and sandbox-mode gate
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: npm test (tsc + sandbox mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
